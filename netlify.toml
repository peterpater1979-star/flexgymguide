[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# De /go/-links (affiliate) staan in public/_redirects.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/go/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
